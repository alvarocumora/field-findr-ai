    <!--
      Recovery net for users still holding a stale service worker from a
      previous deploy. Two failure modes are covered, both guarded by
      sessionStorage so it can never loop:
      1) The entry script or a lazy chunk fails to LOAD (old hashed asset
         404s after a redeploy).
      2) A cached bundle loads but CRASHES before the app paints (e.g. a
         runtime throw at module init) — detected as any uncaught error
         while #root is still empty.
      In either case: unregister the SW, clear its caches and reload ONCE.
    -->
    <script>
      (function () {
        function recover() {
          try {
            if (sessionStorage.getItem('sw-chunk-recovered')) return;
            sessionStorage.setItem('sw-chunk-recovered', '1');
          } catch (e) { /* private mode */ }
          var done = function () { location.reload(); };
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                rs.forEach(function (r) { r.unregister(); });
              }).catch(function () {});
            }
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).then(done, done);
            } else { done(); }
          } catch (e) { done(); }
        }
        function rootIsEmpty() {
          var root = document.getElementById('root');
          return !root || root.childElementCount === 0;
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          // Modo 1: falla la descarga de un asset propio
          if (t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf('/assets/') !== -1) return recover();
          // Modo 2: error de ejecución fatal antes del primer render
          if (e && e.error && rootIsEmpty()) recover();
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e && e.reason && (e.reason.message || String(e.reason));
          if (msg && /(dynamically imported module|Importing a module script failed|Failed to fetch dynamically imported)/i.test(msg)) return recover();
          if (rootIsEmpty()) recover();
        });
      })();
    </script>
