name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Bun for prebuild sitemap
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          # Some unit-test modules instantiate the generated Supabase client
          # during import. Use syntactically valid non-secret placeholders only
          # for tests; they must never be embedded in the production bundle.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-test-publishable-key

      - name: Production build
        run: npm run build

      - name: Verify DreamHost SPA rules are packaged
        run: test -f dist/.htaccess

      - name: Verify critical static routes are in sitemap
        run: |
          grep -q 'https://ofertaterrenos.com/planes-loteos' dist/sitemap.xml
          grep -q 'https://ofertaterrenos.com/contacto-loteos' dist/sitemap.xml

      # The artifact is a convenience download; quota exhaustion must not hide
      # a successful typecheck/test/build validation.
      - name: Upload production bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: oferta-terrenos-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
