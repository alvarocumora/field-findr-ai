name: PR96 one-shot review fix

on:
  push:
    branches:
      - codex/p1-masterplan-available-only-v2

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p1-masterplan-available-only-v2
          fetch-depth: 0
      - name: Move availability view after labels layer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/lots/LotMapView.tsx')
          text = path.read_text()

          old = """      // Vista inicial del masterplan (solo disponibles por defecto).\n      applyAvailabilityView(map.current, onlyAvailableRef.current, colorMode, lots);\n\n"""
          if old not in text:
              raise SystemExit('Expected pre-label availability block not found')
          text = text.replace(old, '', 1)

          anchor = """      });\n\n      // Add roads layer if available\n"""
          replacement = """      });\n\n      // Aplica la vista inicial solo cuando la capa de etiquetas ya existe.\n      // Esto asegura el filtro y el texto abreviado también en carga inicial\n      // y después de cambios de estilo del mapa.\n      applyAvailabilityView(map.current, onlyAvailableRef.current, colorMode, lots);\n\n      // Add roads layer if available\n"""
          if anchor not in text:
              raise SystemExit('Expected post-label anchor not found')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
      - name: Commit functional fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr96-one-shot-fix.yml
          git add src/components/lots/LotMapView.tsx
          git commit -m "fix: apply availability view after lot labels"
          git push origin HEAD:codex/p1-masterplan-available-only-v2
